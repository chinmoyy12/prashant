# Netlify picks these settings up automatically when the repo is imported.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npx vite --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[build.environment]
  NODE_VERSION = "22"

# Long-term caching for hashed JS/CSS bundles and photos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
